<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paletas — Galería</title>
  <style>
    :root{
      --bg: #f6f7f8;
      --card: #ffffff;
      --muted: #6b7280;
      --accent: #111827;
      --glass: rgba(255,255,255,0.6);
      --radius: 12px;
      --shadow: 0 6px 18px rgba(17,24,39,0.06);
      --accent-2: #374151;
      font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: linear-gradient(180deg,var(--bg),#eef2f6 60%);
      color:var(--accent-2);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:48px 20px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .wrap{
      width:100%;
      max-width:1120px;
    }

    header{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:16px;
      margin-bottom:24px;
    }

    .title{
      font-size:20px;
      font-weight:600;
      color:var(--accent);
      letter-spacing: -0.2px;
    }
    .subtitle{
      color:var(--muted);
      font-size:13px;
      margin-top:6px;
    }

    .controls{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .btn{
      background:transparent;
      border:1px solid rgba(17,24,39,0.06);
      padding:8px 12px;
      border-radius:10px;
      font-size:13px;
      color:var(--accent-2);
      cursor:pointer;
      transition:all .16s ease;
      backdrop-filter: blur(6px);
    }
    .btn:hover{transform:translateY(-2px); box-shadow:var(--shadow)}
    .btn.ghost{background:var(--glass)}

    main{
      background:transparent;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:18px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      border:1px solid rgba(16,24,40,0.04);
      display:flex;
      flex-direction:column;
      transition:transform .14s ease, box-shadow .14s ease;
    }
    .card:hover{transform:translateY(-6px)}

    .swatches{
      display:flex;
      gap:0;
      height:96px;
      min-height:72px;
    }
    .swatch{
      flex:1 1 0;
      min-width:0;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:8px;
      color:rgba(255,255,255,0.92);
      font-weight:600;
      font-size:12px;
      letter-spacing:0.6px;
      text-shadow:0 2px 6px rgba(0,0,0,0.25);
      cursor:pointer;
      transition:filter .12s ease;
      user-select:none;
    }
    .swatch.dim{
      color:var(--accent-2);
      text-shadow:none;
    }
    .meta{
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .meta .name{
      font-size:14px;
      font-weight:600;
      color:var(--accent);
    }
    .meta .info{
      font-size:12px;
      color:var(--muted);
    }

    .toast{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:28px;
      background:#111827;
      color:white;
      padding:10px 14px;
      border-radius:10px;
      font-size:13px;
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
    }
    .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px); pointer-events:auto}

    /* small screens adjustments */
    @media (max-width:420px){
      body{padding:24px 12px}
      .swatches{height:72px}
    }

    /* subtle focus styles for accessibility */
    .btn:focus, .swatch:focus{
      outline:3px solid rgba(99,102,241,0.14);
      outline-offset:3px;
    }

  </style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <div>
        <div class="title">Galería de paletas</div>
        <div class="subtitle">Una presentación sobria y elegante de tus paletas de colores.</div>
      </div>

      <div class="controls" aria-hidden="false">
        <button id="loadJsonBtn" class="btn ghost" title="Cargar palettes.json si existe">Cargar palettes.json</button>
        <button id="clearBtn" class="btn" title="Limpiar paletas de ejemplo">Limpiar</button>
      </div>
    </header>

    <main>
      <section id="grid" class="grid" aria-live="polite">
        <!-- cards rendered aquí -->
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">Copiado</div>

  <script>
    // Ejemplo de paletas — reemplaza o carga palettes.json
    const samplePalettes = [
      { name: "Noche Serena", colors: ["#0F172A","#1F2937","#4B5563","#9CA3AF","#F8FAFC"] },
      { name: "Atardecer", colors: ["#3B0D12","#7B2A2A","#D97706","#F59E0B","#FDE68A"] },
      { name: "Mar y Arena", colors: ["#032541","#075985","#0EA5A4","#7DD3FC","#FEF3C7"] },
      { name: "Minimal", colors: ["#111827","#374151","#6B7280","#E5E7EB","#FFFFFF"] }
    ];

    const grid = document.getElementById('grid');
    const toast = document.getElementById('toast');

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(()=> toast.classList.remove('show'), 1700);
    }

    function renderPalettes(palettes){
      grid.innerHTML = '';
      if(!palettes || palettes.length === 0){
        grid.innerHTML = '<div style="grid-column:1/-1;padding:28px 12px;color:var(--muted);text-align:center">No hay paletas para mostrar.</div>';
        return;
      }

      palettes.forEach(p => {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('aria-label', `Paleta ${p.name}`);

        const swatches = document.createElement('div');
        swatches.className = 'swatches';

        p.colors.forEach((c, idx) => {
          const s = document.createElement('button');
          s.className = 'swatch';
          // si el color es muy claro, usar texto oscuro
          const isLight = isColorLight(c);
          if(isLight) s.classList.add('dim');
          s.style.background = c;
          s.innerHTML = `<span aria-hidden="true">${c.toUpperCase()}</span>`;
          s.title = `Copiar ${c.toUpperCase()}`;
          s.addEventListener('click', async () => {
            try{
              await navigator.clipboard.writeText(c.toUpperCase());
              showToast(`${c.toUpperCase()} copiado`);
            }catch(e){
              showToast('No se pudo copiar');
            }
          });
          s.addEventListener('keydown', (ev) => {
            if(ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); s.click(); }
          });
          swatches.appendChild(s);
        });

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = `<div>
                            <div class="name">${escapeHtml(p.name)}</div>
                            <div class="info">${p.colors.length} color${p.colors.length>1?'es':''}</div>
                          </div>
                          <div>
                            <button class="btn" onclick="copyPalette(${encodeURIComponent(JSON.stringify(p.colors))})" title="Copiar colores">Copiar</button>
                          </div>`;

        card.appendChild(swatches);
        card.appendChild(meta);
        grid.appendChild(card);
      });
    }

    // función para copiar toda una paleta (como lista de hex)
    async function copyPalette(colors){
      const text = colors.join(', ').toUpperCase();
      try{
        await navigator.clipboard.writeText(text);
        showToast('Paleta copiada');
      }catch(e){
        showToast('No se pudo copiar');
      }
    }

    // heurística simple para decidir contraste del texto
    function isColorLight(hex){
      try{
        const c = hex.replace('#','');
        const r = parseInt(c.substr(0,2),16);
        const g = parseInt(c.substr(2,2),16);
        const b = parseInt(c.substr(4,2),16);
        // luminance perceptual
        const lum = 0.2126*r + 0.7152*g + 0.0722*b;
        return lum > 180;
      }catch(e){
        return false;
      }
    }

    // carga palettes.json si está disponible en la misma carpeta
    async function loadPalettesJson(){
      try{
        const res = await fetch('./palettes.json', {cache:'no-store'});
        if(!res.ok) throw new Error('no encontrado');
        const data = await res.json();
        if(Array.isArray(data)) {
          renderPalettes(data);
          showToast('palettes.json cargado');
        } else {
          showToast('Formato inválido en palettes.json');
        }
      }catch(e){
        showToast('No se encontró palettes.json');
      }
    }

    // escapado mínimo para evitar inyección en names
    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; });
    }

    // botones de controles
    document.getElementById('loadJsonBtn').addEventListener('click', loadPalettesJson);
    document.getElementById('clearBtn').addEventListener('click', ()=> {
      renderPalettes([]);
    });

    // render inicial con muestras
    renderPalettes(samplePalettes);

    // Exponer copyPalette para el onclick inline
    window.copyPalette = copyPalette;
  </script>
</body>
</html>
