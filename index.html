<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Paletas — Archivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#d1cdb7;
      --paper-2:#dad6c1;
      --paper-3:#c4bfa8;
      --ink:#454138;
      --ink-soft:#7a7564;
      --ink-rgb:69,65,56;
      --accent:#a05a3a;
      --line:rgba(var(--ink-rgb),.38);
      --line-soft:rgba(var(--ink-rgb),.18);
      --sans:"Jost","Helvetica Neue",Arial,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    }

    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      background:var(--paper);
      color:var(--ink);
      font-family:var(--sans);
      font-weight:400;
      -webkit-font-smoothing:antialiased;
      padding:48px 32px 88px;
      display:flex;
      justify-content:center;
      transition:background .5s ease,color .5s ease;
    }
    body::before{
      content:"";
      position:fixed;inset:0;
      pointer-events:none;
      z-index:50;
      background:
        repeating-linear-gradient(0deg,rgba(var(--ink-rgb),.045) 0 1px,transparent 1px 3px),
        radial-gradient(ellipse at center,transparent 55%,rgba(var(--ink-rgb),.16) 100%);
    }
    ::selection{background:var(--ink);color:var(--paper)}
    .wrap{width:100%;max-width:1180px}

    /* ---------- Encabezado ---------- */
    header{
      display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
      padding-bottom:18px;border-bottom:1px solid var(--line);
      position:relative;margin-bottom:32px;
    }
    header::after{content:"";position:absolute;left:0;bottom:-4px;width:84px;height:7px;background:var(--ink)}
    .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px}
    .title{font-size:34px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;line-height:1}
    .title i{
      display:inline-block;width:11px;height:11px;background:var(--accent);
      transform:rotate(45deg);margin-right:18px;vertical-align:middle;position:relative;top:-3px;
      transition:background .4s ease;
    }
    .subtitle{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-soft);margin-top:14px;text-transform:uppercase}
    .subtitle::after{content:"_";margin-left:4px;animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    .controls{display:flex;gap:10px;flex-wrap:wrap}

    .btn{
      font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
      background:transparent;color:var(--ink);border:1px solid var(--ink);
      padding:10px 16px 10px 14px;cursor:pointer;
      transition:background .18s ease,color .18s ease,opacity .18s ease;
    }
    .btn::before{content:"▸";margin-right:10px;font-size:10px}
    .btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
    .btn:disabled{opacity:.35;cursor:default}
    .btn.sm{font-size:10px;padding:8px 12px 8px 10px;letter-spacing:.2em}
    .btn.sm::before{margin-right:7px;font-size:8px}
    .btn.solid{background:var(--ink);color:var(--paper)}
    .btn.solid:hover:not(:disabled){background:transparent;color:var(--ink)}
    .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

    /* ---------- Layout ---------- */
    .layout{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:40px;align-items:start}

    /* ---------- Lista ---------- */
    .list-col{position:sticky;top:24px}
    .list-head{
      font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
      color:var(--ink-soft);padding:0 0 10px;display:flex;justify-content:space-between;
    }
    .list{
      list-style:none;margin:0;padding:0;border-top:1px solid var(--line);
      max-height:calc(100vh - 210px);overflow:auto;
      scrollbar-width:thin;scrollbar-color:var(--ink) transparent;
    }
    .list li{border-bottom:1px solid var(--line-soft)}
    .item{
      position:relative;width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;
      padding:14px 12px 14px 22px;text-align:left;background:transparent;color:var(--ink);border:0;cursor:pointer;
      font-family:var(--sans);transition:background .2s ease,color .2s ease,padding .2s ease;
    }
    .item::before{
      content:"";position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;
      background:var(--accent);transform:rotate(45deg) scale(0);transition:transform .2s ease;
    }
    .item:hover{background:rgba(var(--ink-rgb),.08)}
    .item[aria-selected="true"]{background:var(--ink);color:var(--paper);padding-left:28px}
    .item[aria-selected="true"]::before{transform:rotate(45deg) scale(1)}
    .i-idx{font-family:var(--mono);font-size:10px;letter-spacing:.14em;opacity:.65}
    .i-name{font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .item.themed .i-name::after{content:" ◆";color:var(--accent);font-size:9px}
    .i-strip{display:flex;width:58px;height:10px;border:1px solid rgba(128,128,128,.45)}
    .i-strip i{flex:1}

    /* ---------- Detalle ---------- */
    .detail{position:relative;padding:28px;border:1px solid var(--line-soft);min-width:0}
    .detail::before,.detail::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--ink);pointer-events:none}
    .detail::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
    .detail::after{right:-1px;bottom:-1px;border-left:0;border-top:0}

    .d-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}
    .d-idx{font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:var(--ink-soft);margin-bottom:10px}
    .d-name{margin:0;font-size:28px;font-weight:300;letter-spacing:.3em;text-transform:uppercase;word-break:break-word;line-height:1.2}
    .d-meta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-soft);text-align:right;text-transform:uppercase;line-height:1.7}

    .bars{display:flex;height:300px;border:1px solid var(--line)}
    .bar{
      position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-between;
      padding:12px 10px;border:0;border-right:1px solid rgba(var(--ink-rgb),.14);
      background:var(--c);color:#f3f0e2;cursor:pointer;text-align:left;
      font-family:var(--mono);transition:flex-grow .3s ease,filter .2s ease;
    }
    .bar:last-child{border-right:0}
    .bar.dim{color:#2b2922}
    .bar:hover{flex-grow:2.4}
    .b-top{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
    .b-val{font-size:12px;letter-spacing:.06em;font-weight:500;overflow-wrap:anywhere}
    .bar::after{
      content:"COPIAR";position:absolute;right:8px;top:10px;font-size:8px;letter-spacing:.2em;opacity:0;transition:opacity .2s ease;
    }
    .bar:hover::after{opacity:.8}
    .bars.many{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));height:auto}
    .bars.many .bar{height:110px;border-bottom:1px solid rgba(var(--ink-rgb),.14)}
    .bars.many .bar:hover{flex-grow:1;filter:brightness(1.08)}

    .tools{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:18px 0 26px}
    .chips,.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .chip{
      font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
      background:transparent;color:var(--ink);border:1px solid var(--line);padding:7px 11px;cursor:pointer;
      transition:background .15s ease,color .15s ease;
    }
    .chip:hover{border-color:var(--ink)}
    .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

    /* ---------- Vista previa ---------- */
    .section-label{
      font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);
      display:flex;align-items:center;gap:14px;margin-bottom:14px;
    }
    .section-label::after{content:"";flex:1;height:1px;background:var(--line-soft)}
    .preview{display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
    .mock{
      background:var(--p-bg);color:var(--p-text);border:1px solid var(--p-text);
      padding:16px;display:flex;flex-direction:column;gap:13px;min-height:200px;
    }
    .m-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;padding-bottom:9px;border-bottom:1px solid;border-color:color-mix(in srgb,var(--p-text) 35%,transparent)}
    .m-top b{color:var(--p-accent)}
    .m-title{font-size:16px;font-weight:400;letter-spacing:.2em;text-transform:uppercase}
    .m-lines{display:flex;flex-direction:column;gap:6px}
    .m-lines i{display:block;height:5px;background:currentColor;opacity:.25}
    .m-lines i:nth-child(1){width:92%}.m-lines i:nth-child(2){width:78%}.m-lines i:nth-child(3){width:55%}
    .m-bar{height:8px;border:1px solid currentColor}
    .m-bar b{display:block;height:100%;width:62%;background:var(--p-accent)}
    .m-row{display:flex;gap:8px;margin-top:auto}
    .m-btn{font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:7px 12px;background:var(--p-accent);color:var(--p-bg);font-weight:500}
    .m-btn.ghost{background:transparent;color:var(--p-text);border:1px solid currentColor}

    .roles{display:flex;flex-direction:column;gap:10px}
    .role{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
    .role i{width:18px;height:18px;border:1px solid var(--line)}
    .role code{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-soft)}
    .contrast{
      font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
      padding:10px 12px;border:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:10px;margin-top:2px
    }
    .contrast em{font-style:normal;color:var(--accent);font-weight:500}
    .roles .acts{margin-top:6px}

    /* ---------- Animaciones de cambio ---------- */
    .detail.enter .d-head,.detail.enter .tools,.detail.enter .preview{animation:rise .5s ease both}
    .detail.enter .tools{animation-delay:.12s}
    .detail.enter .preview{animation-delay:.2s}
    .detail.enter .bar{animation:grow .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*55ms)}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes grow{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}

    .hints{
      margin-top:26px;padding-top:14px;border-top:1px solid var(--line-soft);
      font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);
      display:flex;gap:26px;flex-wrap:wrap
    }
    .hints kbd{font-family:inherit;border:1px solid var(--line);padding:2px 6px;margin-right:8px;color:var(--ink)}

    .state{
      padding:56px 18px;border:1px dashed var(--line);text-align:center;
      font-family:var(--mono);font-size:12px;letter-spacing:.06em;line-height:1.9;color:var(--ink-soft);
    }
    .state code{background:var(--paper-3);color:var(--ink);padding:2px 6px}

    .toast{
      position:fixed;left:32px;bottom:32px;z-index:60;background:var(--ink);color:var(--paper);
      padding:12px 20px 12px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
      opacity:0;transform:translateX(-12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease;
    }
    .toast::before{content:"◆";margin-right:12px;font-size:8px;vertical-align:middle;color:var(--accent)}
    .toast.show{opacity:1;transform:none}

    .btn:focus-visible,.chip:focus-visible,.bar:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

    @media (max-width:900px){
      .layout{grid-template-columns:1fr}
      .list-col{position:static}
      .list{max-height:260px}
      .preview{grid-template-columns:1fr}
    }
    @media (max-width:560px){
      body{padding:28px 14px 72px}
      header{flex-direction:column;align-items:flex-start}
      .title{font-size:24px;letter-spacing:.26em}
      .detail{padding:18px}
      .d-head{flex-direction:column;align-items:flex-start}
      .d-meta{text-align:left}
      .d-name{font-size:20px;letter-spacing:.22em}
      .bars{height:220px}
      .toast{left:14px;bottom:14px}
      .hints{display:none}
    }
    @media (prefers-reduced-motion:reduce){
      *{animation:none !important;transition:none !important}
    }
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <div>
        <div class="eyebrow">Archivo // Colores</div>
        <div class="title"><i></i>Paletas</div>
        <div class="subtitle" id="subtitle">Cargando</div>
      </div>
      <div class="controls">
        <button id="resetBtn" class="btn" disabled title="Volver al tema original">Restablecer tema</button>
        <button id="reloadBtn" class="btn" title="Volver a leer el repositorio">Recargar</button>
      </div>
    </header>

    <div class="layout">
      <aside class="list-col">
        <div class="list-head"><span>Registros</span><span id="count">00</span></div>
        <ul id="list" class="list" role="listbox" aria-label="Paletas"></ul>
      </aside>
      <section id="detail" class="detail" aria-live="polite"></section>
    </div>

    <div class="hints" id="hints" hidden>
      <span><kbd>↑</kbd><kbd>↓</kbd>Navegar</span>
      <span><kbd>Enter</kbd>Aplicar al sitio</span>
      <span><kbd>I</kbd>Invertir</span>
      <span><kbd>C</kbd>Copiar lista</span>
      <span><kbd>Esc</kbd>Restablecer</span>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">Copiado</div>

  <script>
    /* ============================================================
       CONFIGURACIÓN
       ------------------------------------------------------------
       Estructura esperada (en la raíz del repositorio):
         /paleta 1/paleta 1.json
         /paleta 2/paleta 2.json
       base   : subcarpeta del repo donde están las carpetas ('' = raíz)
       owner / repo / branch : opcionales; en GitHub Pages
         (usuario.github.io/repo) se detectan solos.
       ignore : carpetas de la raíz que nunca son paletas
       ============================================================ */
    const CONFIG = {
      base: '',
      owner: '',
      repo: '',
      branch: '',
      ignore: ['node_modules','assets','css','js','img','images','docs','src','dist','public','scripts','static']
    };

    const STORE_KEY = 'paletas-tema';
    const $ = id => document.getElementById(id);
    const listEl = $('list'), detail = $('detail'), toast = $('toast');
    const subtitle = $('subtitle'), countEl = $('count'), resetBtn = $('resetBtn'), hints = $('hints');
    const rootStyle = document.documentElement.style;
    const THEME_VARS = ['--paper','--paper-2','--paper-3','--ink','--ink-soft','--ink-rgb','--accent'];

    const state = { palettes: [], sel: 0, fmt: 'hex', sortLum: false, invert: false, themed: null };

    /* ---------- Utilidades ---------- */
    const pad = n => String(n).padStart(2, '0');
    const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove('show'), 1700);
    }
    async function copyText(text, ok){
      try{ await navigator.clipboard.writeText(text); showToast(ok); }
      catch(e){ showToast('No se pudo copiar'); }
    }

    /* ---------- Color ---------- */
    function normalizeHex(v){
      if (typeof v !== 'string') return null;
      let s = v.trim();
      const hash = s.startsWith('#');
      if (hash) s = s.slice(1);
      if (!/^[0-9a-f]+$/i.test(s)) return null;
      if (hash){ if (![3,4,6,8].includes(s.length)) return null; }
      else if (![6,8].includes(s.length)) return null;
      if (s.length <= 4) s = s.split('').map(c => c + c).join('');
      return '#' + s.slice(0,6).toUpperCase();
    }
    const hexToRgb = h => [1,3,5].map(i => parseInt(h.substr(i,2),16));
    const rgbToHex = a => '#' + a.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
    const mix = (a,b,t) => { const x = hexToRgb(a), y = hexToRgb(b); return rgbToHex(x.map((v,i) => v*(1-t) + y[i]*t)); };

    function relLum(h){
      const [r,g,b] = hexToRgb(h).map(v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); });
      return .2126*r + .7152*g + .0722*b;
    }
    const isLight = h => relLum(h) > .32;
    const chroma = h => { const c = hexToRgb(h); return Math.max(...c) - Math.min(...c); };
    function contrast(a,b){
      const x = relLum(a), y = relLum(b);
      return (Math.max(x,y) + .05) / (Math.min(x,y) + .05);
    }
    function grade(r){ return r >= 7 ? 'AAA' : r >= 4.5 ? 'AA' : r >= 3 ? 'AA grande' : 'Bajo'; }

    function toHsl(h){
      let [r,g,b] = hexToRgb(h).map(v => v/255);
      const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
      let H = 0, S = 0; const L = (mx + mn)/2;
      if (d){
        S = d / (1 - Math.abs(2*L - 1));
        if (mx === r) H = ((g-b)/d) % 6; else if (mx === g) H = (b-r)/d + 2; else H = (r-g)/d + 4;
        H = Math.round(H*60); if (H < 0) H += 360;
      }
      return [H, Math.round(S*100), Math.round(L*100)];
    }
    function fmtColor(h, f, short){
      if (f === 'rgb'){ const v = hexToRgb(h).join(', '); return short ? v : `rgb(${v})`; }
      if (f === 'hsl'){ const [a,b,c] = toHsl(h); return short ? `${a}, ${b}%, ${c}%` : `hsl(${a} ${b}% ${c}%)`; }
      return h;
    }

    /* Deriva los roles de la interfaz a partir de una paleta */
    function derive(colors, invert){
      const cs = colors.map(c => c.hex);
      const sorted = [...cs].sort((a,b) => relLum(a) - relLum(b));
      let dark = sorted[0], light = sorted[sorted.length - 1];
      if (cs.length === 1){ dark = mix(cs[0], '#000000', .68); light = mix(cs[0], '#ffffff', .82); }
      const bg = invert ? dark : light;
      const text = invert ? light : dark;
      let pool = cs.filter(c => c !== dark && c !== light);
      if (!pool.length) pool = cs;
      const accent = pool.reduce((best,c) => chroma(c) > chroma(best) ? c : best, pool[0]);
      return { bg, text, accent };
    }

    /* ---------- Lectura de los JSON ---------- */
    const SKIP_KEYS = new Set(['name','nombre','title','id','description','descripcion','author','autor','version','$schema']);
    const GENERIC = new Set(['colors','colores','palette','paleta','swatches','values']);
    const cleanLabel = k => (!k || GENERIC.has(String(k).toLowerCase()) || /^\d+$/.test(k)) ? null : String(k);

    function collect(node, key, out, depth){
      if (depth > 7 || node == null) return;
      if (typeof node === 'string'){
        const h = normalizeHex(node);
        if (h) out.push({ hex: h, label: cleanLabel(key) });
        return;
      }
      if (Array.isArray(node)){ node.forEach(n => collect(n, key, out, depth + 1)); return; }
      if (typeof node === 'object'){
        const direct = node.hex ?? node.color ?? node.value;
        const h = typeof direct === 'string' ? normalizeHex(direct) : null;
        if (h){ out.push({ hex: h, label: cleanLabel(node.name || node.label || key) }); return; }
        for (const [k,v] of Object.entries(node)){
          if (SKIP_KEYS.has(k.toLowerCase())) continue;
          collect(v, k, out, depth + 1);
        }
      }
    }
    function extractColors(data){
      const out = [];
      collect(data, null, out, 0);
      const seen = new Set();
      return out.filter(c => !seen.has(c.hex) && seen.add(c.hex));
    }
    function extractName(data, fallback){
      if (data && !Array.isArray(data) && typeof data === 'object'){
        const n = data.name || data.nombre || data.title;
        if (typeof n === 'string' && n.trim()) return n.trim();
      }
      return fallback;
    }

    /* ---------- Descubrir carpetas ---------- */
    function detectRepo(){
      let { owner, repo } = CONFIG;
      const host = location.hostname;
      if ((!owner || !repo) && host.endsWith('.github.io')){
        owner = owner || host.split('.')[0];
        repo = repo || (location.pathname.split('/')[1] || host);
      }
      return { owner, repo };
    }
    const basePath = () => CONFIG.base.replace(/^\/|\/$/g, '');
    const prefix = () => basePath() ? basePath() + '/' : '';

    async function listDirs(){
      // 1) Manifiesto opcional en la raíz: paletas.json -> ["paleta 1","paleta 2"]
      try{
        const r = await fetch(prefix() + 'paletas.json', { cache: 'no-store' });
        if (r.ok){
          const l = await r.json();
          if (Array.isArray(l)) return l.filter(x => typeof x === 'string').map(x => x.replace(/\/$/, ''));
        }
      }catch(e){}
      // 2) API de GitHub: carpetas de la raíz
      const { owner, repo } = detectRepo();
      if (!owner || !repo) throw new Error('NO_REPO');
      const ref = CONFIG.branch ? `?ref=${encodeURIComponent(CONFIG.branch)}` : '';
      const url = `https://api.github.com/repos/${owner}/${repo}/contents${basePath() ? '/' + basePath() : ''}${ref}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) throw new Error('API_' + res.status);
      const items = await res.json();
      return items
        .filter(i => i.type === 'dir' && !/^[._]/.test(i.name) && !CONFIG.ignore.includes(i.name.toLowerCase()))
        .map(i => i.name);
    }

    async function loadPalettes(){
      listEl.innerHTML = '';
      detail.innerHTML = '<div class="state">Cargando datos…</div>';
      subtitle.textContent = 'Cargando';
      hints.hidden = true;

      let dirs;
      try{ dirs = await listDirs(); }
      catch(e){
        subtitle.textContent = 'Error de lectura';
        detail.innerHTML = e.message === 'NO_REPO'
          ? 'No se pudo detectar el repositorio.<br>Completá <code>owner</code> y <code>repo</code> en <code>CONFIG</code>, o agregá un <code>paletas.json</code> en la raíz con la lista de carpetas.'
          : `No se pudo listar el repositorio (${esc(e.message)}).<br>Verificá que sea público y el nombre de la rama.`;
        detail.innerHTML = `<div class="state">${detail.innerHTML}</div>`;
        return;
      }

      dirs.sort((a,b) => a.localeCompare(b, 'es', { numeric: true }));

      const results = await Promise.all(dirs.map(async dir => {
        try{
          const enc = encodeURIComponent(dir);
          const res = await fetch(`${prefix()}${enc}/${enc}.json`, { cache: 'no-store' });
          if (!res.ok) return null;
          const data = await res.json();
          const colors = extractColors(data);
          if (!colors.length) return null;
          return { dir, name: extractName(data, dir), colors };
        }catch(e){ return null; }
      }));

      state.palettes = results.filter(Boolean);
      countEl.textContent = pad(state.palettes.length);
      subtitle.textContent = state.palettes.length
        ? `${pad(state.palettes.length)} registros · archivo activo`
        : 'Sin registros';

      if (!state.palettes.length){
        detail.innerHTML = '<div class="state">No se encontraron paletas.<br>Cada carpeta debe contener un <code>.json</code> con el mismo nombre que la carpeta.</div>';
        return;
      }

      hints.hidden = false;
      restoreTheme();
      state.sel = Math.min(state.sel, state.palettes.length - 1);
      renderList();
      renderDetail(true);
    }

    /* ---------- Lista ---------- */
    function renderList(){
      listEl.innerHTML = state.palettes.map((p,i) => `
        <li><button class="item${state.themed === p.name ? ' themed' : ''}" role="option" data-i="${i}" aria-selected="${i === state.sel}">
          <span class="i-idx">${pad(i + 1)}</span>
          <span class="i-name">${esc(p.name)}</span>
          <span class="i-strip">${p.colors.slice(0,8).map(c => `<i style="background:${c.hex}"></i>`).join('')}</span>
        </button></li>`).join('');
    }
    function select(i, opts = {}){
      const n = state.palettes.length;
      if (!n) return;
      i = Math.max(0, Math.min(n - 1, i));
      const changed = i !== state.sel;
      state.sel = i;
      listEl.querySelectorAll('.item').forEach((el, k) => el.setAttribute('aria-selected', k === i));
      const el = listEl.querySelectorAll('.item')[i];
      if (opts.focus && el){ el.focus(); }
      renderDetail(changed || opts.force);
    }

    /* ---------- Detalle ---------- */
    function renderDetail(animate){
      const p = state.palettes[state.sel];
      if (!p) return;
      const cols = state.sortLum ? [...p.colors].sort((a,b) => relLum(a.hex) - relLum(b.hex)) : p.colors;
      const d = derive(p.colors, state.invert);
      const ratio = contrast(d.bg, d.text);
      const themed = state.themed === p.name;

      detail.classList.remove('enter');
      void detail.offsetWidth;
      if (animate) detail.classList.add('enter');

      detail.innerHTML = `
        <div class="d-head">
          <div>
            <div class="d-idx">N.º ${pad(state.sel + 1)} / ${pad(state.palettes.length)}</div>
            <h2 class="d-name">${esc(p.name)}</h2>
          </div>
          <div class="d-meta">${p.colors.length} color${p.colors.length > 1 ? 'es' : ''}<br>/${esc(p.dir)}</div>
        </div>

        <div class="bars${cols.length > 8 ? ' many' : ''}">
          ${cols.map((c,i) => `
            <button class="bar${isLight(c.hex) ? ' dim' : ''}" data-hex="${c.hex}" style="--c:${c.hex};--i:${i}" title="Copiar ${fmtColor(c.hex, state.fmt)}">
              <span class="b-top">${esc(c.label || 'Color ' + pad(i + 1))}</span>
              <span class="b-val">${esc(fmtColor(c.hex, state.fmt, true))}</span>
            </button>`).join('')}
        </div>

        <div class="tools">
          <div class="chips" role="group" aria-label="Formato de color">
            ${['hex','rgb','hsl'].map(f => `<button class="chip" data-fmt="${f}" aria-pressed="${state.fmt === f}">${f}</button>`).join('')}
            <button class="chip" data-act="sort" aria-pressed="${state.sortLum}">Por luminosidad</button>
          </div>
          <div class="acts">
            <button class="btn sm" data-act="copy-list">Lista</button>
            <button class="btn sm" data-act="copy-css">CSS</button>
            <button class="btn sm" data-act="copy-json">JSON</button>
          </div>
        </div>

        <div class="section-label">Vista previa del tema</div>
        <div class="preview">
          <div class="mock" style="--p-bg:${d.bg};--p-text:${d.text};--p-accent:${d.accent}">
            <div class="m-top"><span>Sistema // Muestra</span><b>◆</b></div>
            <div class="m-title">Interfaz de ejemplo</div>
            <div class="m-lines"><i></i><i></i><i></i></div>
            <div class="m-bar"><b></b></div>
            <div class="m-row"><span class="m-btn">Aceptar</span><span class="m-btn ghost">Cancelar</span></div>
          </div>
          <div class="roles">
            <div class="role"><i style="background:${d.bg}"></i><span>Fondo</span><code>${d.bg}</code></div>
            <div class="role"><i style="background:${d.text}"></i><span>Texto</span><code>${d.text}</code></div>
            <div class="role"><i style="background:${d.accent}"></i><span>Acento</span><code>${d.accent}</code></div>
            <div class="contrast"><span>Contraste ${ratio.toFixed(1)}:1</span><em>${grade(ratio)}</em></div>
            <div class="acts">
              <button class="btn sm" data-act="invert" aria-pressed="${state.invert}">Invertir</button>
              <button class="btn sm solid" data-act="theme">${themed ? 'Quitar del sitio' : 'Aplicar al sitio'}</button>
            </div>
          </div>
        </div>`;
    }

    /* ---------- Acciones ---------- */
    const current = () => state.palettes[state.sel];
    const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    function copyList(){
      const p = current(); if (!p) return;
      copyText(p.colors.map(c => fmtColor(c.hex, state.fmt)).join(', '), 'Lista copiada');
    }
    function copyCss(){
      const p = current(); if (!p) return;
      const used = new Set();
      const lines = p.colors.map((c,i) => {
        let n = c.label ? slug(c.label) : 'color-' + (i + 1);
        if (!n || used.has(n)) n = (n || 'color') + '-' + (i + 1);
        used.add(n);
        return `  --${n}: ${fmtColor(c.hex, state.fmt)};`;
      });
      copyText(`:root {\n${lines.join('\n')}\n}`, 'CSS copiado');
    }
    function copyJson(){
      const p = current(); if (!p) return;
      const hasLabels = p.colors.some(c => c.label);
      const colors = hasLabels
        ? Object.fromEntries(p.colors.map((c,i) => [c.label || 'color' + (i + 1), c.hex]))
        : p.colors.map(c => c.hex);
      copyText(JSON.stringify({ name: p.name, colors }, null, 2), 'JSON copiado');
    }

    /* ---------- Tema del sitio ---------- */
    function setThemeVars(p){
      const d = derive(p.colors, state.invert);
      rootStyle.setProperty('--paper', d.bg);
      rootStyle.setProperty('--paper-2', mix(d.bg, d.text, .07));
      rootStyle.setProperty('--paper-3', mix(d.bg, d.text, .14));
      rootStyle.setProperty('--ink', d.text);
      rootStyle.setProperty('--ink-soft', mix(d.text, d.bg, .42));
      rootStyle.setProperty('--ink-rgb', hexToRgb(d.text).join(','));
      rootStyle.setProperty('--accent', d.accent);
    }
    function persist(){
      try{
        if (state.themed) localStorage.setItem(STORE_KEY, JSON.stringify({ name: state.themed, invert: state.invert }));
        else localStorage.removeItem(STORE_KEY);
      }catch(e){}
    }
    function applyTheme(p, quiet){
      state.themed = p.name;
      setThemeVars(p);
      resetBtn.disabled = false;
      persist();
      if (!quiet) showToast('Tema aplicado');
    }
    function resetTheme(quiet){
      if (!state.themed) return;
      THEME_VARS.forEach(v => rootStyle.removeProperty(v));
      state.themed = null;
      resetBtn.disabled = true;
      persist();
      if (!quiet) showToast('Tema restablecido');
      refreshThemeUi();
    }
    function toggleTheme(){
      const p = current(); if (!p) return;
      if (state.themed === p.name) resetTheme();
      else { applyTheme(p); refreshThemeUi(); }
    }
    function toggleInvert(){
      state.invert = !state.invert;
      const t = state.palettes.find(p => p.name === state.themed);
      if (t){ setThemeVars(t); persist(); }
      renderDetail(false);
      refocus('[data-act="invert"]');
    }
    function refreshThemeUi(){
      listEl.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('themed', state.palettes[i].name === state.themed));
      renderDetail(false);
      refocus('[data-act="theme"]');
    }
    function restoreTheme(){
      try{
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        const idx = state.palettes.findIndex(p => p.name === s.name);
        if (idx < 0) return;
        state.invert = !!s.invert;
        state.sel = idx;
        applyTheme(state.palettes[idx], true);
      }catch(e){}
    }
    function refocus(sel){
      const el = detail.querySelector(sel);
      if (el && detail.contains(document.activeElement) === false && document.activeElement !== document.body) return;
      if (el) el.focus({ preventScroll: true });
    }

    /* ---------- Eventos ---------- */
    listEl.addEventListener('click', e => {
      const b = e.target.closest('.item');
      if (b) select(+b.dataset.i);
    });

    detail.addEventListener('click', e => {
      const bar = e.target.closest('[data-hex]');
      if (bar){ copyText(fmtColor(bar.dataset.hex, state.fmt), fmtColor(bar.dataset.hex, state.fmt, true) + ' copiado'); return; }

      const f = e.target.closest('[data-fmt]');
      if (f){ state.fmt = f.dataset.fmt; renderDetail(false); refocus(`[data-fmt="${state.fmt}"]`); return; }

      const a = e.target.closest('[data-act]');
      if (!a) return;
      switch (a.dataset.act){
        case 'sort': state.sortLum = !state.sortLum; renderDetail(false); refocus('[data-act="sort"]'); break;
        case 'copy-list': copyList(); break;
        case 'copy-css': copyCss(); break;
        case 'copy-json': copyJson(); break;
        case 'invert': toggleInvert(); break;
        case 'theme': toggleTheme(); break;
      }
    });

    $('reloadBtn').addEventListener('click', loadPalettes);
    resetBtn.addEventListener('click', () => resetTheme());

    document.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const ae = document.activeElement;
      if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
      if (!state.palettes.length) return;
      const k = e.key;
      if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'Home' || k === 'End'){
        e.preventDefault();
        let i = state.sel;
        if (k === 'ArrowDown') i++; else if (k === 'ArrowUp') i--;
        else if (k === 'Home') i = 0; else i = state.palettes.length - 1;
        select(i, { focus: true });
      } else if (k === 'Enter' && (ae === document.body || (ae && ae.classList.contains('item')))){
        e.preventDefault(); toggleTheme();
      } else if (k === 'Escape'){
        resetTheme();
      } else if (k.toLowerCase() === 'i'){
        toggleInvert();
      } else if (k.toLowerCase() === 'c'){
        copyList();
      }
    });

    loadPalettes();
  </script>
</body>
</html>
